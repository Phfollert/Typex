[project]
name = "typex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "mypy>=1.18.2",
    "pyrefly>=0.42.3",
    "pyright>=1.1.407",
    "ty>=0.0.1a27",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: tests that invoke real typecheckers (deselect with -m 'not slow')",
]

[tool.pyright]
typeCheckingMode = "strict"
