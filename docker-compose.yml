# Local-dev infrastructure for share links: an S3-compatible object store (MinIO)
# plus a one-shot job that creates the share bucket. The backend talks to it over
# the S3 API using the TYPEX_S3_* env in .env.example (see that file to wire it up).
#
#   docker compose up -d        # start MinIO + create the bucket
#   docker compose down         # stop (keeps data in the named volume)
#   docker compose down -v      # stop and wipe stored objects

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data

  # Creates the share bucket once MinIO accepts connections, then exits.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/typex-share;
      mc mb --ignore-existing local/typex-share-test;
      "

volumes:
  minio-data:
